name: Woody's Store Test — https://woocommerce.woodys.extend.com/

on:
  pull_request:
    branches:
      - master

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # The blocks under helloextend-protection/client compile into
      # helloextend-protection/build, which is what gets zipped below. Without
      # this the test store runs against whatever build output happened to be
      # committed, not the PR's source.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cypress ships its browser binary through a postinstall script that
      # writes to ~/.cache/Cypress, outside the pnpm store. pnpm skips a
      # dependency's build scripts once its store entry is marked built, and
      # setup-node's `cache: pnpm` restores the store but not that directory —
      # so on a store cache hit the postinstall never runs and the binary is
      # absent, failing `cypress run` before a single test executes. This
      # command is a no-op when the pinned version is already unpacked, and
      # takes about ten seconds when it is not.
      - name: Ensure the Cypress binary is installed
        run: pnpm exec cypress install

      - name: Build blocks
        run: pnpm run build

      - name: Verify block build output
        run: |
          MANIFEST="helloextend-protection/build/blocks-manifest.php"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST was not produced by the build — the plugin would deploy with no blocks."
            exit 1
          fi

          # Each manifest key must resolve to build/<key>/block.json. WordPress
          # builds that exact path to locate a block's metadata, and when it
          # misses it registers a block with no scripts and no render callback
          # — silently, with nothing in the inserter.
          php -r '
            $manifest = require "helloextend-protection/build/blocks-manifest.php";
            $missing = [];
            foreach (array_keys($manifest) as $block) {
                if (!file_exists("helloextend-protection/build/$block/block.json")) {
                    $missing[] = $block;
                }
            }
            if ($missing) {
                fwrite(STDERR, "::error::Manifest keys with no block.json: " . implode(", ", $missing) . "\n");
                exit(1);
            }
            echo "Verified " . count($manifest) . " block(s) in the build collection.\n";
          '

      - name: Zip the updated plugin folder
        run: zip -r helloextend-protection.zip helloextend-protection

      - name: Upload plugin via WordPress REST API
        run: |
          RESPONSE=$(curl -X POST "https://woocommerce.woodys.extend.com/wp-json/wp/v2/plugins" \
            -u "${{ secrets.WP_ADMIN_AUTH }}" \
            -F "plugin=@helloextend-protection.zip")
          echo "Upload Response: $RESPONSE"

      - name: Install and activate plugin in Woody's WooCommerce Store
        run: |
          RESPONSE=$(curl -X POST "https://woocommerce.woodys.extend.com/wp-json/wp/v2/plugins/install" \
            -u "${{ secrets.WP_ADMIN_AUTH }}")
          echo "Install & Activate Response: $RESPONSE"

      - name: Delete uploaded zip file
        run: |
          RESPONSE=$(curl -X DELETE "https://woocommerce.woodys.extend.com/wp-json/wp/v2/plugins/cleanup?file=helloextend-protection.zip" \
            -u "${{ secrets.WP_ADMIN_AUTH }}")
          echo "Cleanup Response: $RESPONSE"

      - name: Run Cypress tests for plugin settings
        run: npx cypress run --spec "cypress/integration/01_plugin_settings.cy.js"
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          STORE_ID: ${{ secrets.STORE_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      - name: Run Cypress frontend checks
        run: npx cypress run --spec "cypress/integration/02_frontend_checks.cy.js"

      - name: Run Cypress checkout tests
        run: npx cypress run --spec "cypress/integration/03_order_processing_checks.cy.js"
        env:
          WP_ADMIN_USERNAME: ${{ secrets.WP_ADMIN_USERNAME }}
          WP_ADMIN_PASSWORD: ${{ secrets.WP_ADMIN_PASSWORD }}
          STORE_ID: ${{ secrets.STORE_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
