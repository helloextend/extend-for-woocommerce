name: Deploy to WordPress.org

on:
  release:
    types: [published]

jobs:
  deploy:
    name: Deploy plugin to WordPress.org SVN
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Verify release tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(awk '/^ \* Version:/ {print $3}' helloextend-protection/helloextend-protection.php)
          STABLE_TAG=$(awk '/^Stable tag:/ {print $3}' helloextend-protection/readme.txt)

          echo "Release tag:            $TAG_VERSION"
          echo "Plugin header version:  $PLUGIN_VERSION"
          echo "readme.txt stable tag:  $STABLE_TAG"

          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ] || [ "$TAG_VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Version mismatch — the release tag, plugin header Version, and readme.txt Stable tag must all match before deploying."
            exit 1
          fi

      - name: Deploy to WordPress.org plugin repository
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: helloextend-protection
          BUILD_DIR: helloextend-protection
          ASSETS_DIR: helloextend-protection/assets
