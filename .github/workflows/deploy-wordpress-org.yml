name: Deploy to WordPress.org

on:
  release:
    types: [released]

jobs:
  deploy:
    name: Deploy plugin to WordPress.org SVN
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify release tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION=$(awk '/^ \* Version:/ {print $3}' helloextend-protection/helloextend-protection.php)
          STABLE_TAG=$(awk '/^Stable tag:/ {print $3}' helloextend-protection/readme.txt)

          echo "Release tag:            $TAG_VERSION"
          echo "Plugin header version:  $PLUGIN_VERSION"
          echo "readme.txt stable tag:  $STABLE_TAG"

          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ] || [ "$TAG_VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Version mismatch — the release tag, plugin header Version, and readme.txt Stable tag must all match before deploying."
            exit 1
          fi

      # The blocks under helloextend-protection/client are compiled into
      # helloextend-protection/build, which is what BUILD_DIR ships. Building
      # here means the released plugin always matches the tagged source rather
      # than whatever happened to be committed last.
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build blocks
        run: pnpm run build

      - name: Verify block build output
        run: |
          MANIFEST="helloextend-protection/build/blocks-manifest.php"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST was not produced by the build — the plugin would ship with no blocks."
            exit 1
          fi

          # Each manifest key must resolve to build/<key>/block.json. WordPress
          # builds that exact path to locate a block's metadata, and when it
          # misses it registers a block with no scripts and no render callback
          # — silently, with nothing in the inserter.
          php -r '
            $manifest = require "helloextend-protection/build/blocks-manifest.php";
            $missing = [];
            foreach (array_keys($manifest) as $block) {
                if (!file_exists("helloextend-protection/build/$block/block.json")) {
                    $missing[] = $block;
                }
            }
            if ($missing) {
                fwrite(STDERR, "::error::Manifest keys with no block.json: " . implode(", ", $missing) . "\n");
                exit(1);
            }
            echo "Verified " . count($manifest) . " block(s) in the build collection.\n";
          '

      - name: Deploy to WordPress.org plugin repository
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # v2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: helloextend-protection
          BUILD_DIR: helloextend-protection
          ASSETS_DIR: helloextend-protection/assets
